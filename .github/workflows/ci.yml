name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-javascript:
    name: JavaScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: docs
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5
        ports:
          - '5432:5432'

    steps:
      - name: Wait for PostgreSQL
        timeout-minutes: 1
        run: |
          until docker exec ${{ job.services.postgres.id }} pg_isready; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Start Docs in Container
        run: |
          docker run -d \
            --network host \
            -p "3000:3000" \
            -e DATABASE_URL="postgres://postgres:postgres@localhost:5432/docs" \
            -e SEED=1 \
            ghcr.io/olillin/new-docs:latest

      - name: Wait for Docs
        timeout-minutes: 1
        run: |
          until curl -f "http://localhost:3000"; do
            echo "Waiting for Docs..."
            sleep 2
          done

      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          path: ./resources/document.pdf
          category_slug: operational-documents
          document_slug: bylaws
          base_url: http://localhost:3000

      - name: Print Output
        id: output
        run: echo "${{ steps.test-action.outputs.location }}"
